name: Build and Verify ASP.NET Core App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore ProductCatalogueApp.csproj

    - name: Build App
      run: dotnet build ProductCatalogueApp.csproj --configuration Release --no-restore

    - name: Publish App
      run: dotnet publish ProductCatalogueApp.csproj --configuration Release -o ./publish
